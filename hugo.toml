baseURL = 'https://woodand.glass/'
languageCode = 'en-us'
title = 'Wood and Glass LLC'
theme = 'gallery'

copyright = "© Dave Hamrick"
defaultContentLanguage = "en"
enableRobotsTXT = true
timeZone = "America/New_York"
timeout = "120s"

[params]
defaultTheme = "light"
description = "Handcrafted wood and glass by Dave Hamrick. Disabled U.S. Navy veteran-owned and made in Virginia."
[params.socialIcons]
# facebook = "https://www.facebook.com/"
# instagram = "https://www.instagram.com/"
# github = "https://github.com/nicokaiser/hugo-theme-gallery/"
# youtube = "https://www.youtube.com/"
# email = "mailto:user@example.com"
#website = "https://example.com"
#mastodon = "https://example.com"
#pixelfed = "https://example.com"
#mixcloud = "https://example.com"
#flickr = "https://www.flickr.com"
#500px = "https://500px"
#whatsapp = "1234567890"

[[menus.main]]
name = "Home"
url = "/"
weight = 1

[[menus.main]]
name = "Wood"
url = "/wood/"
weight = 2

[[menus.main]]
name = "Glass"
url = "/glass/"
weight = 3

[[menus.main]]
name = "About Dave"
url = "/about/"
weight = 4

[[menus.main]]
name = "Shop on Etsy"
url = "https://www.etsy.com/shop/WoodAndGlassLLCShop"
weight = 5

[[menus.main]]
name = "Craft Shows"
url = "/#upcoming-events"
weight = 6

[params.gallery]
#boxSpacing = 10
#targetRowHeight = 288
#targetRowHeightTolerance = 0.25

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]

[imaging]
quality = 75
resampleFilter = "CatmullRom"
[imaging.exif]
disableDate = false
disableLatLong = true
includeFields = "ImageDescription|Orientation"

[services]
[services.rss]
limit = 100

[[menus.main]]
name = "Contact Dave"
url = "/contact/"
weight = 7
